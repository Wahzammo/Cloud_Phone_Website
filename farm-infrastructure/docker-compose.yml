version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # NODE 1: Pixel 6a (Bluejay) - House 1 / Device A
  # Native 6GB RAM Device - Perfect match for host constraints
  # ---------------------------------------------------------------------------
  redroid1:
    image: redroid/redroid:11.0.0_gapps_ndk_magisk_widevine
    container_name: redroid-1
    privileged: true
    restart: unless-stopped
    ports:
      - "5555:5555"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G # Native Pixel 6a Spec
    volumes:
      - ./data1:/data
      - /dev/binderfs:/dev/binderfs
      - /dev/dri:/dev/dri
    command:
      # --- GPU CONFIG (RX 580) ---
      - android.hardware.gralloc=gbm
      - ro.hardware.egl=mesa
      - ro.hardware.vulkan=radeon
      - androidboot.redroid_gpu_mode=host
      # --- MAGISK FLAGS ---
      - ro.secure=0
      - ro.debuggable=1
      # --- SPOOFING: Google Pixel 6a (Bluejay) ---
      # Adjusted to Android 12 to match Redroid container OS version
      - ro.product.brand=google
      - ro.product.manufacturer=Google
      - ro.product.model=Pixel 6a
      - ro.product.device=bluejay
      - ro.product.name=bluejay
      - ro.product.board=bluejay
      # Official Android 12 (June 2022) Fingerprint for consistency
      - ro.build.fingerprint=google/bluejay/bluejay:12/SD2A.220601.003/8654604:user/release-keys
      - ro.build.description=bluejay-user 12 SD2A.220601.003 8654604 release-keys
      - ro.build.version.security_patch=2022-06-05
      - ro.product.first_api_level=31
      - scrcpy.max_fps=30

