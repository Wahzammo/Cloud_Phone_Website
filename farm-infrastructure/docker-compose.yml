version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # NODE 1: Tab S9 Ultra (Port 5555)
  # ---------------------------------------------------------------------------
  redroid1:
    image: z220-farm:v1-magisk-core:latest
    container_name: redroid-1
    privileged: true
    restart: unless-stopped
    ports:
      - "5555:5555"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
    volumes:
      - ./data1:/data
      # CORRECTED: Use binderfs for Ubuntu 22.04/Kernel 5.15+
      - /dev/binderfs:/dev/binderfs
      # GPU Access
      - /dev/dri:/dev/dri
    command:
      # --- GPU CONFIG (RX 580) ---
      - android.hardware.gralloc=gbm
      - ro.hardware.egl=mesa
      - ro.hardware.vulkan=radeon
      - androidboot.redroid_gpu_mode=host
      # --- MAGISK FLAGS ---
      - ro.secure=0
      - ro.debuggable=1
      # --- SPOOFING: Tab S9 Ultra (SM-X916B) ---
      - ro.product.model=SM-X916B
      - ro.product.brand=samsung
      - ro.product.manufacturer=samsung
      - ro.product.device=zeppelin
      - ro.build.fingerprint=samsung/zeppelin/zeppelin:12/SP1A.210812.016/X916BXXU4BWL1:user/release-keys
      - scrcpy.max_fps=30

